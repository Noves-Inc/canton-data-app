name: noves-canton-data-app-v4-setup

services:
  database:
    image: ${DATABASE_IMAGE:-ghcr.io/noves-inc/noves-canton-database-v4:candidate-30160846627-1@sha256:1482f1bbe6ca9039ebe4bdcdf7442d34acf9389b2799215b95e10ee8d01ba49b}
    container_name: noves-canton-database-v4
    environment:
      POSTGRES_USER: appuser
      POSTGRES_DB: canton_index
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      PGDATA: /home/postgres/pgdata/data
    volumes:
      - cda-database-data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d canton_index -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - canton
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-noves.azurecr.io/cda-backend:prod-3e1a1fde-1785439104@sha256:37cad1fe33871bf08ba1be9699c11e87c643931e51d295c9de7bfed8afe1c793}
    container_name: noves-canton-backend-v4
    environment:
      INDEX_DB_HOST: database
      INDEX_DB_PORT: "5432"
      INDEX_DB_NAME: canton_index
      INDEX_DB_USER: appuser
      INDEX_DB_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      INDEX_DB_WRITE_BATCH_SIZE: ${INDEX_DB_WRITE_BATCH_SIZE:-250}
      DATABASE_MAX_PARALLEL_WORKERS_PER_GATHER: ${DATABASE_MAX_PARALLEL_WORKERS_PER_GATHER:-0}
      DATABASE_SYNCHRONOUS_COMMIT: ${DATABASE_SYNCHRONOUS_COMMIT:-off}
      DATABASE_MAX_WAL_SIZE: ${DATABASE_MAX_WAL_SIZE:-8GB}
      NODES_CONFIG_FILE_PATH: /config/nodes-config.json
      CANTON_NETWORK: ${CANTON_NETWORK:-mainnet}
      SCAN_PROXY_URL: ${CANTON_VALIDATOR_URL:-http://validator:5003}
      SETUP_ENABLED: "true"
      SETUP_TOKEN: ${SETUP_TOKEN:?Set SETUP_TOKEN}
      M2M_INDEXER_ENABLED: "false"
      NOVES_GATEWAY_AUTH_TOKEN_FILE: /run/secrets/noves-gateway-auth-token
    volumes:
      - type: bind
        source: ./.state/nodes-config.json
        target: /config/nodes-config.json
        read_only: true
        bind:
          create_host_path: false
      - cda-exports:/exports
    secrets:
      - noves-gateway-auth-token
    depends_on:
      database:
        condition: service_healthy
    networks:
      - canton
    restart: unless-stopped

  setup-wizard:
    image: ${FRONTEND_IMAGE:-noves.azurecr.io/cda-frontend:prod-c78cdd33-1785419965@sha256:3205d0193e1b493098f9d1704604206f173fb456aa6fb6dbcc8b8529f70266b1}
    container_name: noves-canton-frontend-v4
    user: "${SETUP_USER:-1000:1000}"
    command: ["node", "runtime/setup.mjs"]
    environment:
      PORT: "3000"
      CANTON_TRANSLATE_BASE_URL: http://backend:8090
      SETUP_TOKEN: ${SETUP_TOKEN:?Set SETUP_TOKEN}
      SETUP_SESSION_TOKEN: ${SETUP_SESSION_TOKEN:?Set SETUP_SESSION_TOKEN}
      SETUP_PARTICIPANT_ADDRESS: ${CANTON_PARTICIPANT_ADDRESS:-participant:5001}
      SETUP_STORAGE_MODE: file
      SETUP_RESULT_PATH: /setup/values.json
      SETUP_SECRET_PATH: /setup/capture.env
    volumes:
      - ./.state:/setup
    ports:
      - "127.0.0.1:${SETUP_PORT:-8099}:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - canton
    restart: unless-stopped

networks:
  canton:
    external: true
    name: ${CANTON_DOCKER_NETWORK:-splice-validator_splice_validator}

volumes:
  cda-database-data:
    name: ${DATABASE_VOLUME:-noves-canton-data-app-v4-data}
  cda-exports:
    name: ${EXPORTS_VOLUME:-noves-canton-data-app-v4-exports}

secrets:
  noves-gateway-auth-token:
    file: ./.secrets/noves-gateway-auth-token
