# Use only after completing the v3.16.1 migration checklist and setting
# DATABASE_VOLUME to the stopped v3 database volume.
services:
  backend:
    environment:
      SETUP_ENABLED: "false"

volumes:
  cda-database-data:
    external: true
    name: ${DATABASE_VOLUME:?Set DATABASE_VOLUME to the Data App v3.16.1 volume}
