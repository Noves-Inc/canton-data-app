name: noves-canton-data-app-v4

services:
  database:
    image: ${DATABASE_IMAGE:-ghcr.io/noves-inc/noves-canton-database-v4:candidate-30160846627-1@sha256:1482f1bbe6ca9039ebe4bdcdf7442d34acf9389b2799215b95e10ee8d01ba49b}
    container_name: noves-canton-database-v4
    environment:
      POSTGRES_USER: appuser
      POSTGRES_DB: canton_index
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      PGDATA: /home/postgres/pgdata/data
    volumes:
      - ${DATABASE_DATA_PATH:-database}:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d canton_index -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - canton
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/noves-inc/noves-canton-backend-v4:prod-3e1a1fde-1785439104@sha256:37cad1fe33871bf08ba1be9699c11e87c643931e51d295c9de7bfed8afe1c793}
    container_name: noves-canton-backend-v4
    environment:
      INDEX_DB_HOST: database
      INDEX_DB_PORT: "5432"
      INDEX_DB_NAME: canton_index
      INDEX_DB_USER: appuser
      INDEX_DB_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      INDEX_DB_WRITE_BATCH_SIZE: ${INDEX_DB_WRITE_BATCH_SIZE:-250}
      DATABASE_MAX_PARALLEL_WORKERS_PER_GATHER: ${DATABASE_MAX_PARALLEL_WORKERS_PER_GATHER:-0}
      DATABASE_SYNCHRONOUS_COMMIT: ${DATABASE_SYNCHRONOUS_COMMIT:-off}
      READ_MODEL_TOTAL_CAPACITY: ${READ_MODEL_TOTAL_CAPACITY:-4}
      READ_MODEL_RESERVED_LIVE_CAPACITY: ${READ_MODEL_RESERVED_LIVE_CAPACITY:-1}
      BACKGROUND_INDEXING_DUTY_PERCENT: ${BACKGROUND_INDEXING_DUTY_PERCENT:-100}
      STREAM_POLL_INTERVAL_MS: ${STREAM_POLL_INTERVAL_MS:-5000}
      STREAM_PAGE_SIZE: ${STREAM_PAGE_SIZE:-100}
      STREAM_RETRY_DELAY_MS: ${STREAM_RETRY_DELAY_MS:-2000}
      STREAM_WEBSOCKET_BUFFER_LIMIT: ${STREAM_WEBSOCKET_BUFFER_LIMIT:-10000}
      STREAM_DATABASE_TIMEOUT_SECONDS: ${STREAM_DATABASE_TIMEOUT_SECONDS:-60}
      STREAM_DEDUPLICATION_WINDOW_RECORDS: ${STREAM_DEDUPLICATION_WINDOW_RECORDS:-1000000}
      STREAM_DELIVERY_RECENCY_MINUTES: ${STREAM_DELIVERY_RECENCY_MINUTES:-1440}
      ALLOW_PRIVATE_WEBHOOK_TARGETS: ${ALLOW_PRIVATE_WEBHOOK_TARGETS:-false}
      NODES_CONFIG_FILE_PATH: /config/nodes-config.json
      CANTON_NETWORK: ${CANTON_NETWORK:-mainnet}
      SCAN_PROXY_URL: ${CANTON_VALIDATOR_URL:-http://validator:5003}
      PUBLIC_SCAN_INDEXER_URL: ${CANTON_PUBLIC_SCAN_URL:-}
    env_file:
      - path: ./.state/capture.env
        required: true
      - path: ./.state/accounting.env
        required: true
      - path: ./.state/storage.env
        required: false
    volumes:
      - type: bind
        source: ./.state/nodes-config.json
        target: /config/nodes-config.json
        read_only: true
        bind:
          create_host_path: false
      - exports:/exports
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8090}:8090"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - canton
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/noves-inc/noves-canton-frontend-v4:prod-c78cdd33-1785419965@sha256:3205d0193e1b493098f9d1704604206f173fb456aa6fb6dbcc8b8529f70266b1}
    container_name: noves-canton-frontend-v4
    environment:
      PORT: "3000"
      CANTON_TRANSLATE_BASE_URL: http://backend:8090
      VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN:-}
      VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:-}
      VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE:-}
      VITE_AUTH0_REDIRECT_URI: ${APP_URL:?Set APP_URL}/callback
      VITE_AUTH0_LOGOUT_URL: ${APP_URL}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-}
      VITE_KEYCLOAK_REDIRECT_URI: ${APP_URL}/callback
      VITE_KEYCLOAK_LOGOUT_URL: ${APP_URL}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8091}:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - canton
    restart: unless-stopped

networks:
  canton:
    external: true
    name: ${CANTON_DOCKER_NETWORK:-splice-validator_splice_validator}

volumes:
  database:
    name: ${DATABASE_VOLUME:-noves-canton-data-app-v4-data}
  exports:
    name: ${EXPORTS_VOLUME:-noves-canton-data-app-v4-exports}
