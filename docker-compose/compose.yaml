name: noves-canton-data-app-v4

services:
  database:
    image: ghcr.io/noves-inc/noves-canton-database-v4:${CDA_VERSION:-4.0.0}
    container_name: noves-canton-database-v4
    environment:
      POSTGRES_USER: appuser
      POSTGRES_DB: canton_index
      POSTGRES_PASSWORD: ${CDA_DATABASE_PASSWORD:?Set CDA_DATABASE_PASSWORD}
      PGDATA: /home/postgres/pgdata/data
    volumes:
      - ${CANTON_DATA_APP_DB_DATA:-cda-database-data}:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d canton_index -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - canton
    restart: unless-stopped

  backend:
    image: ghcr.io/noves-inc/noves-canton-backend-v4:${CDA_VERSION:-4.0.0}
    container_name: noves-canton-backend-v4
    environment:
      INDEX_DB_HOST: database
      INDEX_DB_PORT: "5432"
      INDEX_DB_NAME: canton_index
      INDEX_DB_USER: appuser
      INDEX_DB_PASSWORD: ${CDA_DATABASE_PASSWORD:?Set CDA_DATABASE_PASSWORD}
      NODES_CONFIG_FILE_PATH: /config/nodes-config.json
      CDA_NETWORK: ${CDA_NETWORK:-mainnet}
      SCAN_PROXY_URL: ${CDA_VALIDATOR_URL:-http://validator-app:5003}
      PUBLIC_SCAN_INDEXER_URL: ${CDA_PUBLIC_SCAN_URL:-}
      NOVES_GATEWAY_AUTH_TOKEN_FILE: /run/secrets/noves-gateway-auth-token
    env_file:
      - path: ./.state/capture.env
        required: false
    volumes:
      - ./.state/nodes-config.json:/config/nodes-config.json:ro
      - cda-exports:/exports
    secrets:
      - noves-gateway-auth-token
    ports:
      - "127.0.0.1:${CDA_BACKEND_PORT:-8090}:8090"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - canton
    restart: unless-stopped

  frontend:
    image: ghcr.io/noves-inc/noves-canton-frontend-v4:${CDA_VERSION:-4.0.0}
    container_name: noves-canton-frontend-v4
    environment:
      PORT: "3000"
      CANTON_TRANSLATE_BASE_URL: http://backend:8090
      VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN:-}
      VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:-}
      VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE:-}
      VITE_AUTH0_REDIRECT_URI: ${CDA_APP_URL:?Set CDA_APP_URL}/callback
      VITE_AUTH0_LOGOUT_URL: ${CDA_APP_URL}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-}
      VITE_KEYCLOAK_REDIRECT_URI: ${CDA_APP_URL}/callback
      VITE_KEYCLOAK_LOGOUT_URL: ${CDA_APP_URL}
      NOVES_GATEWAY_AUTH_TOKEN_FILE: /run/secrets/noves-gateway-auth-token
    volumes:
      - cda-exports:/app/exports
    secrets:
      - noves-gateway-auth-token
    ports:
      - "${CDA_FRONTEND_BIND:-127.0.0.1}:${CDA_FRONTEND_PORT:-8091}:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - canton
    restart: unless-stopped

networks:
  canton:
    external: true
    name: ${CANTON_DOCKER_NETWORK:-splice-validator_splice_validator}

volumes:
  cda-database-data:
    name: ${CDA_DATABASE_VOLUME:-noves-canton-data-app-v4-data}
  cda-exports:
    name: ${CDA_EXPORTS_VOLUME:-noves-canton-data-app-v4-exports}

secrets:
  noves-gateway-auth-token:
    file: ./.secrets/noves-gateway-auth-token
