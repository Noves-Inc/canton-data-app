slots:
  - id: auth0-spa-callbacks
    provider: Auth0
    page: Applications > browser application > Settings > Application URIs
    crop: Field labels and values for callbacks, logout, and web origins
    redact: Tenant name, client ID, unrelated URLs
    filename: auth0-spa-callbacks.webp
    status: pending
  - id: auth0-m2m-api-grant
    provider: Auth0
    page: Applications > capture application > APIs
    crop: Selected Canton API and minimal authorized grant
    redact: Tenant name, client ID, secrets
    filename: auth0-m2m-api-grant.webp
    status: pending
  - id: auth0-token-subject
    provider: Auth0
    page: Local token inspection
    crop: sub, iss, and aud claims only
    redact: Access token, client secret, tenant identifiers
    filename: auth0-token-subject.webp
    status: pending
  - id: auth0-canton-rights
    provider: Canton
    page: Ledger API user rights output
    crop: Capture user and CanReadAsAnyParty
    redact: Participant ID and party identifiers
    filename: auth0-canton-rights.webp
    status: pending
  - id: keycloak-public-client
    provider: Keycloak
    page: Clients > browser client > Settings
    crop: Capability config, redirects, logout redirects, and web origins
    redact: Realm-specific identifiers
    filename: keycloak-public-client.webp
    status: pending
  - id: keycloak-service-account
    provider: Keycloak
    page: Clients > capture client > Settings
    crop: Client authentication and Service accounts roles
    redact: Client secret and realm identifiers
    filename: keycloak-service-account.webp
    status: pending
  - id: keycloak-ledger-scope
    provider: Keycloak
    page: Capture client scopes and audience mapper
    crop: daml_ledger_api assignment and audience value
    redact: Internal hostnames and realm identifiers
    filename: keycloak-ledger-scope.webp
    status: pending
  - id: keycloak-token-subject
    provider: Keycloak
    page: Local token inspection
    crop: sub, iss, and aud claims only
    redact: Access token and client secret
    filename: keycloak-token-subject.webp
    status: pending
  - id: keycloak-canton-rights
    provider: Canton
    page: Ledger API user rights output
    crop: Capture user and CanReadAsAnyParty
    redact: Participant ID and party identifiers
    filename: keycloak-canton-rights.webp
    status: pending
