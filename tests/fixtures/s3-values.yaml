oidc:
  provider: auth0
  appUrl: https://data.example.com
  auth0:
    domain: tenant.example.auth0.com
    clientId: browser-client
    audience: https://ledger-api

canton:
  expectedParticipantId: participant::expected

capture:
  existingSecret: cda-capture-auth

database:
  existingSecret: cda-database

routing:
  provider: ingress
  host: data.example.com
  ingress:
    className: nginx

exports:
  storage: s3
  s3:
    bucket: cda-exports
    endpointUrl: https://objects.example.com
    region: us-east-1
    existingSecret: cda-s3

backup:
  s3:
    enabled: true
    bucket: cda-backups
    endpointUrl: https://objects.example.com
    region: us-east-1
    existingSecret: cda-s3
