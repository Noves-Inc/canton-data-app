nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

backend:
  replicaCount: 1
  image:
    repository: ghcr.io/noves-inc/noves-canton-backend-v4
    tag: "4.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  performance:
    database:
      writeBatchSize: 250
      maxParallelWorkersPerGather: 0
      synchronousCommit: "off"
      maxWalSize: 8GB
      deadTupleRatioLimit: 0.30
      deadTupleMinimum: 1000
      transactionAgeLimit: 100000
      writeIoUtilizationLimit: 0.90
      connectionUtilizationLimit: 0.85
      commitP95LimitMs: 250
    readModel:
      totalCapacity: 4
      reservedLiveCapacity: 1
      liveWeight: 4
      bootstrapWeight: 1
      bootstrapBatchSize: 25
      pressureCheckIntervalMs: 5000
      pressureResumeRatio: 0.80
      captureLagLimitRecords: 2000
      liveWorkMaxWaitMs: 30000
      processMemoryLimitBytes: 4294967296
  streaming:
    pollIntervalMs: 5000
    pageSize: 100
    retryDelayMs: 2000
    websocketBufferLimit: 10000
    databaseTimeoutSeconds: 60
    deduplicationWindowRecords: 1000000
    deliveryRecencyMinutes: 1440
    allowPrivateWebhookTargets: false

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/noves-inc/noves-canton-frontend-v4
    tag: "4.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

database:
  image:
    repository: ghcr.io/noves-inc/noves-canton-database-v4
    tag: "4.0.0"
    pullPolicy: IfNotPresent
  existingSecret: noves-canton-data-app-database
  passwordKey: postgres-password
  name: canton_index
  user: appuser
  persistence:
    existingClaim: ""
    size: 100Gi
    # Leave empty only for local/portable installs. Production should explicitly select encrypted
    # SSD block storage (AKS managed-csi-premium, EKS gp3, or GKE premium-rwo).
    storageClass: ""
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 8Gi

exports:
  persistence:
    size: 20Gi
    storageClass: ""

canton:
  nodeId: main-node
  participantAddress: participant:5001
  expectedParticipantId: ""
  validatorParty: ""
  synchronizerAlias: global
  expectedSynchronizerId: ""
  certificateSecret: ""
  certificateKey: ca.crt
  validatorUrl: http://validator-app:5003
  publicScanUrl: ""
  network: mainnet

capture:
  existingSecret: noves-canton-data-app-capture-auth
  ledgerApiUserKey: ledger-api-user
  tokenEndpointKey: token-endpoint
  clientIdKey: client-id
  clientSecretKey: client-secret
  audienceKey: audience
  scopeKey: scope

novesGateway:
  existingSecret: noves-canton-data-app-gateway
  tokenKey: token

oidc:
  provider: ""
  appUrl: ""
  auth0:
    domain: ""
    clientId: ""
    audience: ""
  keycloak:
    url: ""
    realm: canton
    clientId: ""

routing:
  enabled: false
  host: ""
  tlsSecret: ""
  annotations: {}
  istio:
    enabled: false
    gateway: cluster-ingress/cn-http-gateway
  ingress:
    enabled: false
    className: ""

setupWizard:
  enabled: false
  setupTokenSecret: noves-canton-data-app-setup-token
  setupTokenKey: token
  sessionTokenKey: session-token
  localPort: 8099

migration:
  enabled: false
  sourceVersion: ""
  backupConfirmed: false
  oldWorkloadStopped: false
  existingClaim: ""

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
