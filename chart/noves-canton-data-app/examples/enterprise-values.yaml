backend:
  image:
    tag: "4.0.0"
  # Keep defaults initially. Raise these only with matching database capacity.
  performance:
    database:
      maxParallelWorkersPerGather: 0
      maxWalSize: 8GB
    readModel:
      totalCapacity: 4
      reservedLiveCapacity: 1
frontend:
  image:
    tag: "4.0.0"
database:
  image:
    tag: "4.0.0"
  existingSecret: noves-canton-data-app-database
  persistence:
    # Production requires encrypted SSD-backed block storage. Examples:
    # AKS: managed-csi-premium; EKS: an encrypted gp3 class; GKE: premium-rwo.
    storageClass: replace-with-production-ssd-storage-class

capture:
  existingSecret: noves-canton-data-app-capture-auth

novesGateway:
  existingSecret: noves-canton-data-app-gateway
  tokenKey: token

canton:
  expectedParticipantId: "participant::replace-me"

oidc:
  provider: auth0
  appUrl: https://data.example.com
  auth0:
    domain: tenant.example.auth0.com
    clientId: replace-with-browser-client-id
    audience: https://canton.network.global

routing:
  enabled: true
  host: data.example.com
  istio:
    enabled: true
    gateway: cluster-ingress/cn-http-gateway

setupWizard:
  enabled: false
