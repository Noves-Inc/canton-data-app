apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cda.fullname" . }}-frontend
  labels:
    {{- include "cda.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "cda.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        {{- with (include "cda.installationSecretValues" . | fromYaml).canary }}
        checksum/installation-canary: {{ b64dec . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cda.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.frontend.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: installation-secrets
          image: {{ include "cda.image" .Values.frontend.image | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.frontend.containerSecurityContext | nindent 12 }}
          command:
            - sh
            - -ec
            - |
              {{- include "cda.installationSecretCopyScript" (list "canary-capability") | nindent 14 }}
          volumeMounts:
            - name: installation-secret-sources
              mountPath: /installation-secret-sources
              readOnly: true
            - name: installation-secrets
              mountPath: /installation-secrets
      containers:
        - name: frontend
          image: {{ include "cda.image" .Values.frontend.image | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.frontend.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: {{ include "cda.fullname" . }}-frontend
          env:
            - name: INSTALLATION_CANARY_CAPABILITY_FILE
              value: /installation-secrets/canary-capability
          volumeMounts:
            - name: installation-secrets
              mountPath: /installation-secrets
              readOnly: true
          # Readiness answers whether this process can serve, not whether the backend
          # is reachable. The app renders its own backend-unavailable state; a pod
          # removed from the Service renders nothing at all, so gating readiness on a
          # 3-second call to the backend replaces a clear in-app message with an
          # ingress error at exactly the moment the operator needs to be told what is
          # wrong. /api/health stays available as a diagnostic and is what the UI reads.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        # Read only by the installation-secrets init container. The frontend pod sets no fsGroup, so the
        # projected file is root-owned and needs the read bit for others to reach the frontend uid; no
        # other container mounts it, and the copy the frontend reads is 0600.
        - name: installation-secret-sources
          projected:
            defaultMode: 0444
            sources:
              - secret:
                  name: {{ include "cda.installationCanarySecretName" . | quote }}
                  items:
                    - key: {{ .Values.installation.canary.key | quote }}
                      path: canary-capability
        - name: installation-secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cda.fullname" . }}-frontend
  labels:
    {{- include "cda.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    {{- include "cda.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
