apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cda.fullname" . }}-backend
  labels:
    {{- include "cda.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "cda.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cda.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: INDEX_DB_HOST
              value: {{ printf "%s-database" (include "cda.fullname" .) | quote }}
            - name: INDEX_DB_PORT
              value: "5432"
            - name: INDEX_DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: INDEX_DB_USER
              value: {{ .Values.database.user | quote }}
            - name: INDEX_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.passwordKey }}
            - name: INDEX_DB_WRITE_BATCH_SIZE
              value: {{ .Values.backend.performance.database.writeBatchSize | quote }}
            - name: DATABASE_MAX_PARALLEL_WORKERS_PER_GATHER
              value: {{ .Values.backend.performance.database.maxParallelWorkersPerGather | quote }}
            - name: DATABASE_SYNCHRONOUS_COMMIT
              value: {{ .Values.backend.performance.database.synchronousCommit | quote }}
            - name: DATABASE_MAX_WAL_SIZE
              value: {{ .Values.backend.performance.database.maxWalSize | quote }}
            - name: DATABASE_DEAD_TUPLE_RATIO_LIMIT
              value: {{ .Values.backend.performance.database.deadTupleRatioLimit | quote }}
            - name: DATABASE_DEAD_TUPLE_MINIMUM
              value: {{ .Values.backend.performance.database.deadTupleMinimum | quote }}
            - name: DATABASE_TRANSACTION_AGE_LIMIT
              value: {{ .Values.backend.performance.database.transactionAgeLimit | quote }}
            - name: DATABASE_WRITE_IO_UTILIZATION_LIMIT
              value: {{ .Values.backend.performance.database.writeIoUtilizationLimit | quote }}
            - name: DATABASE_CONNECTION_UTILIZATION_LIMIT
              value: {{ .Values.backend.performance.database.connectionUtilizationLimit | quote }}
            - name: DATABASE_COMMIT_P95_LIMIT_MS
              value: {{ .Values.backend.performance.database.commitP95LimitMs | quote }}
            - name: READ_MODEL_TOTAL_CAPACITY
              value: {{ .Values.backend.performance.readModel.totalCapacity | quote }}
            - name: READ_MODEL_RESERVED_LIVE_CAPACITY
              value: {{ .Values.backend.performance.readModel.reservedLiveCapacity | quote }}
            - name: READ_MODEL_LIVE_WEIGHT
              value: {{ .Values.backend.performance.readModel.liveWeight | quote }}
            - name: READ_MODEL_BOOTSTRAP_WEIGHT
              value: {{ .Values.backend.performance.readModel.bootstrapWeight | quote }}
            - name: READ_MODEL_BOOTSTRAP_BATCH_SIZE
              value: {{ .Values.backend.performance.readModel.bootstrapBatchSize | quote }}
            - name: READ_MODEL_PRESSURE_CHECK_INTERVAL_MS
              value: {{ .Values.backend.performance.readModel.pressureCheckIntervalMs | quote }}
            - name: READ_MODEL_PRESSURE_RESUME_RATIO
              value: {{ .Values.backend.performance.readModel.pressureResumeRatio | quote }}
            - name: READ_MODEL_CAPTURE_LAG_LIMIT_RECORDS
              value: {{ .Values.backend.performance.readModel.captureLagLimitRecords | quote }}
            - name: READ_MODEL_LIVE_WORK_MAX_WAIT_MS
              value: {{ .Values.backend.performance.readModel.liveWorkMaxWaitMs | quote }}
            - name: PROCESS_MEMORY_LIMIT_BYTES
              value: {{ .Values.backend.performance.readModel.processMemoryLimitBytes | quote }}
            - name: NODES_CONFIG_FILE_PATH
              value: /config/nodes-config.json
            - name: CANTON_NETWORK
              value: {{ .Values.canton.network | quote }}
            - name: SCAN_PROXY_URL
              value: {{ .Values.canton.validatorUrl | quote }}
            - name: PUBLIC_SCAN_INDEXER_URL
              value: {{ .Values.canton.publicScanUrl | quote }}
            - name: NOVES_GATEWAY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.novesGateway.existingSecret }}
                  key: {{ .Values.novesGateway.tokenKey }}
            - name: M2M_INDEXER_ENABLED
              value: {{ ternary "false" "true" .Values.setupWizard.enabled | quote }}
            {{- if not .Values.setupWizard.enabled }}
            - name: M2M_TOKEN_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.capture.existingSecret }}
                  key: {{ .Values.capture.tokenEndpointKey }}
            - name: M2M_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.capture.existingSecret }}
                  key: {{ .Values.capture.clientIdKey }}
            - name: M2M_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.capture.existingSecret }}
                  key: {{ .Values.capture.clientSecretKey }}
            - name: M2M_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.capture.existingSecret }}
                  key: {{ .Values.capture.audienceKey }}
            - name: M2M_SCOPE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.capture.existingSecret }}
                  key: {{ .Values.capture.scopeKey }}
                  optional: true
            {{- end }}
            {{- if .Values.setupWizard.enabled }}
            - name: SETUP_ENABLED
              value: "true"
            - name: SETUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.setupWizard.setupTokenSecret }}
                  key: {{ .Values.setupWizard.setupTokenKey }}
            {{- else if .Values.migration.enabled }}
            - name: SETUP_ENABLED
              value: "false"
            {{- end }}
          volumeMounts:
            - name: nodes
              mountPath: /config
              readOnly: true
            - name: exports
              mountPath: /exports
            {{- if .Values.canton.certificateSecret }}
            - name: canton-certificate
              mountPath: /certificates
              readOnly: true
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            failureThreshold: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: nodes
          configMap:
            name: {{ include "cda.fullname" . }}-nodes
        - name: exports
          persistentVolumeClaim:
            claimName: {{ include "cda.fullname" . }}-exports
        {{- if .Values.canton.certificateSecret }}
        - name: canton-certificate
          secret:
            secretName: {{ .Values.canton.certificateSecret }}
            items:
              - key: {{ .Values.canton.certificateKey }}
                path: ca.crt
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cda.fullname" . }}-backend
  labels:
    {{- include "cda.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    {{- include "cda.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8090
      targetPort: http
