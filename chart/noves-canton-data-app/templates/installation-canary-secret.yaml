{{- /*
The installation canary capability. The frontend presents it to the backend for the server-side
frontend canary, so both pods read the same Secret and it never reaches a browser.

It carries no stored state, so it follows the release instead of the database: lookup reuses it on
upgrade, and without the keep policy uninstall deletes it, so every reinstall starts with a new value.
*/ -}}
{{- if not .Values.installation.canary.existingSecret }}
{{- $values := include "cda.installationSecretValues" . | fromYaml }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cda.installationCanarySecretName" . }}
  labels:
    {{- include "cda.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.installation.canary.key }}: {{ $values.canary }}
{{- end }}
