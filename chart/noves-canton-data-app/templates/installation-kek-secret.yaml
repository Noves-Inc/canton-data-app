{{- /*
The installation key-encryption key. The backend encrypts the installation's private signing key with
it and stores the ciphertext in the database, so the database and this value are only useful together.

The Secret is kept on uninstall and reused through lookup on every upgrade and reinstall. It is never
replaced on its own initiative: a new value on a database that already holds installation material
leaves the backend unable to use its credential. Two states are therefore render failures instead of
regeneration:
- the Secret exists without its key;
- the Secret is gone while the release's live backend already depends on a KEK (its pod template
  records the Secret name), which is a lost Secret next to a retained database.
A backend that predates the KEK (4.1.3) records nothing, so its first upgrade generates the value.
*/ -}}
{{- if not .Values.installation.kek.existingSecret }}
{{- $name := include "cda.installationKekSecretName" . }}
{{- $key := .Values.installation.kek.key }}
{{- $backendName := printf "%s-backend" (include "cda.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $backend := lookup "apps/v1" "Deployment" .Release.Namespace $backendName }}
{{- $value := "" }}
{{- if $existing }}
{{- $value = index ($existing.data | default dict) $key | default "" }}
{{- if not $value }}
{{- fail (printf "Secret %s exists without key %s. The installation KEK is never regenerated: restore the backed-up value into that key, or name an operator-managed Secret in installation.kek.existingSecret." $name $key) }}
{{- end }}
{{- else if dig "spec" "template" "metadata" "annotations" "noves.fi/installation-kek-secret" "" $backend }}
{{- fail (printf "Secret %s is missing, but backend %s already uses an installation KEK. Generating a new KEK would leave the database's installation credential unusable: restore the backed-up Secret %s, or name an operator-managed Secret in installation.kek.existingSecret." $name $backendName $name) }}
{{- else }}
{{- $value = randBytes 32 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "cda.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
data:
  {{ $key }}: {{ $value }}
{{- end }}
