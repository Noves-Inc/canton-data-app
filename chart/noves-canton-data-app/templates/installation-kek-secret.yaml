{{- /*
The installation key-encryption key. The backend encrypts the installation's private signing key with
it and stores the ciphertext in the database, so the database and this value are only useful together.
cda.installationSecretValues holds the reuse and fail-closed rules.

The Secret is kept on uninstall so a reinstall adopts it, and it is immutable: an apply that carries a
different value, for example from a renderer that cannot look up the live Secret, is rejected by the
API server instead of replacing the key. Restoring a backup means deleting and recreating the Secret.
*/ -}}
{{- if not .Values.installation.kek.existingSecret }}
{{- $values := include "cda.installationSecretValues" . | fromYaml }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cda.installationKekSecretName" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "cda.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
immutable: true
data:
  {{ .Values.installation.kek.key }}: {{ $values.kek }}
{{- end }}
