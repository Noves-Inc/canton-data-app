{{- if not .Values.accounting.tokenEncryption.existingSecret }}
{{- $name := printf "%s-accounting-token-encryption" (include "cda.fullname" .) }}
{{- $key := .Values.accounting.tokenEncryption.key }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "cda.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $key }}: {{ if and $existing (hasKey $existing.data $key) }}{{ index $existing.data $key }}{{ else }}{{ randBytes 32 | b64enc }}{{ end }}
{{- end }}
